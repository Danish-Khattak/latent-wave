# Bounded one-source fixture. src/pretrain_jepa.py --smoke forces one sample,
# performs one real optimizer/EMA update, and exits.
encoder:
  architecture: mamba2
  img_size: [224, 224]
  patch_size: 16
  embed_dim: 256
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  mamba2:
    d_state: 64
    d_conv: 4
    expand: 1
    headdim: 64
    directionality: bidirectional

predictor:
  embed_dim: 128
  depth: 4
  num_heads: 4

wandb:
  project_name: "latent-wave-smoke"

data:
  pretrain_datasets:
    - name: spectrogram
      path: ../data/pretraining/nrpos-indoor.h5
      key: normalized_csi
  batch_size: 1
  validation_fraction: 0.05
  num_workers: 0
  pin_mem: false

masks:
  type: multi_block
  multi_block:
    allow_overlap: false
    aspect_ratio_type: span_time
    aspect_ratio: [0.75, 1.5]
    enc_mask_scale: [1.0, 1.0]
    min_keep: 10
    num_enc_masks: 1
    num_pred_masks: 2
    pred_mask_scale: [0.15, 0.2]
  random:
    ratios: [0.7, 0.8]

optimization:
  ema: [0.8, 0.9]
  epochs: 1
  warmup: 0
  start_lr: 1.0e-6
  ref_lr: 1.0e-3
  final_lr: 1.0e-6
  ref_weight_decay: 0.04
  final_weight_decay: 0.04
  grad_clip: null
  grad_accumulation_steps: 1
  precision: 32-true

checkpoint:
  dir: ../runs/latent-wave/mamba2_smoke
  every_n_epochs: 1

seed: 123

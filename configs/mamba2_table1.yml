# Table I alternative: 3000 epochs, 150 warmup, aggregate batch 128,
# predictor depth 2, 2 target masks, and final weight decay 0.4.
encoder:
  architecture: mamba2
  img_size: [224, 224]
  patch_size: 16
  embed_dim: 256
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  mamba2:
    d_state: 64
    d_conv: 4
    expand: 1
    headdim: 64
    directionality: bidirectional

predictor:
  embed_dim: 128
  depth: 2
  num_heads: 4

wandb:
  project_name: "latent-wave"

data:
  pretrain_datasets:
    - name: spectrogram
      path: ../data/pretraining/spectrogram-pretrain.h5
      key: spectrogram
    - name: rfp
      path: ../data/pretraining/rfp.h5
      key: normalized_spectrograms
    - name: wifi-csi
      path: ../data/pretraining/wifi-csi.h5
      key: normalized_csi
    - name: nrpos-indoor
      path: ../data/pretraining/nrpos-indoor.h5
      key: normalized_csi
  batch_size: 8 # per-source microbatch to fit the 16 GB GPU
  validation_fraction: 0.05
  num_workers: 4
  pin_mem: true

masks:
  type: multi_block
  multi_block:
    allow_overlap: false
    aspect_ratio_type: span_time
    aspect_ratio: [0.75, 1.5]
    enc_mask_scale: [0.85, 1.0]
    min_keep: 10
    num_enc_masks: 1
    num_pred_masks: 2
    pred_mask_scale: [0.15, 0.2]
  random:
    ratios: [0.7, 0.8]

optimization:
  ema: [0.996, 1.0]
  epochs: 3000
  warmup: 150
  start_lr: 1.0e-6
  ref_lr: 1.0e-3
  final_lr: 1.0e-6
  ref_weight_decay: 0.04
  final_weight_decay: 0.4
  grad_clip: null
  grad_accumulation_steps: 4 # 4 x 4 sources x 8 samples = aggregate 128/update
  precision: 32-true

checkpoint:
  dir: ../runs/latent-wave/mamba2_table1
  every_n_epochs: 5

seed: 0

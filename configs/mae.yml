encoder:
  img_size: [224, 224]
  patch_size: 16
  embed_dim: 256
  depth: 8
  num_heads: 8

predictor:
  embed_dim: 128
  depth: 4
  num_heads: 4

wandb:
  project_name: "latent-wfm"

data:
  pretrain_datasets:
  - name: "spectrogram"
    path: ../preprocessed_datasets/spectrogram-pretrain.h5
    key: "spectrogram"
  - name: "rfp"
    path: ../preprocessed_datasets/rfp.h5
    key: "normalized_spectrograms"
  - name: "wifi-csi"
    path: ../preprocessed_datasets/wifi-csi.h5
    key: "normalized_csi"
  - name: "nrpos-indoor"
    path: ../preprocessed_datasets/nrpos-indoor.h5
    key: "normalized_csi"

  rfs_path: ../preprocessed_datasets/rfs.h5
  pos_path: ../preprocessed_datasets/nrpos-outdoor.h5
  beam_path: ../preprocessed_datasets/deepmimo.h5
  batch_size: 64
  num_workers: 4
  pin_mem: true

masks:
  type: "random"
  
  multi_block:
    allow_overlap: false
    aspect_ratio_type: "random"
    aspect_ratio:
    - 0.75
    - 1.5
    enc_mask_scale:
    - 0.85
    - 1.0
    min_keep: 10
    num_enc_masks: 1
    num_pred_masks: 2
    pred_mask_scale:
    - 0.15
    - 0.2

  random:
    ratios:
    - 0.75
    - 0.75

optimization:
  epochs: 240
  warmup: 12
  start_lr: 1.0e-06
  ref_lr: 0.001
  final_lr: 1.0e-06
  ref_weight_decay: 0.04
  final_weight_decay: 0.04
  grad_clip: 1.0

checkpoint:
  dir: "pretraining_checkpoints"
  every_n_epochs: 5

seed: 0